name: Actualizar Calendario Anual

on:
  schedule:
    # Día 1 de cada mes a las 06:00 UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-calendario
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar script generador de ICS
        run: python generate_ics.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add festivos.ics
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualización automática del calendario de festivos"
            git push
          fi
